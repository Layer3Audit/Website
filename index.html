<!DOCTYPE html>
<!-- Dimension by HTML5 UP (html5up.net) — CC BY 3.0 (html5up.net/license) -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Layer3Audit</title>
  <link rel="stylesheet" href="css/main.css">
  <noscript><link rel="stylesheet" href="css/noscript.css"></noscript>
</head>
<body class="is-preload">
  <div id="wrapper">
    <header id="header">
      <div class="logo">
        <img src="img/layer3audit-logo.png" alt="Layer3Audit — Network Infrastructure Health">
      </div>
      <div class="content">
        <div class="inner">
          <p>We specialise in infrastructure health and architectural assessments.<br>
             With extensive experience across enterprise networking and hybrid environments<br> 
             we help organisations uncover weaknesses, optimise performance and strengthen<br> 
             the foundation of their IT infrastructure.<br></p>
        </div>
      </div>
      <nav class="contact-only" aria-label="Main navigation">
        <ul><li><a href="#contact">Contact</a></li></ul>
      </nav>
    </header>

    <div id="main">
      <article id="contact">
        <h2 class="major">Contact</h2>
        <form id="contact-form" method="post" action="https://formspree.io/f/mvkkkylw">
          <div class="fields">
            <div class="field half">
              <label for="name">Name</label>
              <input type="text" name="name" id="name" autocomplete="name" required>
            </div>
            <div class="field half">
              <label for="email">Email</label>
              <input type="email" name="email" id="email" autocomplete="email" required>
            </div>
            <div class="field">
              <label for="subject">Subject</label>
              <input type="text" name="subject" id="subject" required>
            </div>
            <div class="field">
              <label for="message">Message</label>
              <textarea name="message" id="message" rows="4" required></textarea>
            </div>
          </div>
          <ul class="actions">
            <li><input id="contact-submit" type="submit" value="Send Message" class="primary"></li>
            <li><input type="reset" value="Reset"></li>
          </ul>
          <p id="contact-feedback" class="contact-feedback" role="status" aria-live="polite" style="display: none; margin-top: 0.75rem;"></p>
        </form>
      </article>
    </div>
  </div>
  <div id="bg"></div>
  <script src="js/jquery.min.js"></script>
  <script src="js/browser.min.js"></script>
  <script src="js/breakpoints.min.js"></script>
  <script src="js/util.js"></script>
  <script src="js/main.js"></script>
  <script src="js/custom.js"></script>
</body>
</html>
